plugins {
    id "org.jetbrains.dokka"
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.protobuf'
}

android {
    namespace 'io.livekit.android.test'
    compileSdkVersion androidSdk.compileVersion

    defaultConfig {
        minSdkVersion androidSdk.minVersion
        targetSdkVersion androidSdk.targetVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility java_version
        targetCompatibility java_version
    }
    kotlinOptions {
        freeCompilerArgs = ["-Xinline-classes", "-opt-in=kotlin.RequiresOptIn", "-opt-in=io.livekit.android.annotations.Beta"]
        jvmTarget = java_version
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    lint {
        disable 'VisibleForTests'
    }
}

ext.livekitProtoIncludes = [
        'livekit_token_source.proto',
        'livekit_room.proto',
        'livekit_agent_dispatch.proto',
        'livekit_agent.proto',
        'livekit_egress.proto',
]
ext.livekitProtoImportSrc = true
apply from: rootProject.file('gradle/livekit-protobuf.gradle')

// Allow this module's Kotlin compilations to resolve `internal` APIs from :livekit-android-sdk
// https://kotlinlang.org/docs/visibility-modifiers.html#modules
//
// Use projectsEvaluated so :livekit-android-sdk Kotlin compile tasks exist before friendPaths
// references them.
gradle.projectsEvaluated {
    def sdk = rootProject.project(':livekit-android-sdk')
    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
        def variant
        if (task.name.startsWith('compileDebug')) {
            variant = 'Debug'
        } else if (task.name.startsWith('compileRelease')) {
            variant = 'Release'
        } else {
            return
        }
        // Point at the same `classes.jar` AGP puts on the compile classpath (not only `tmp/kotlin-classes`),
        // or Kotlin will not treat the SDK as a friend module for `internal` visibility.
        task.friendPaths.from(sdk.tasks.named("bundleLibCompileToJar${variant}"))
    }
}

dokkaHtml {
    moduleName.set("livekit-android-test")
    dokkaSourceSets {
        configureEach {
            skipEmptyPackages.set(true)
            includeNonPublic.set(false)
            includes.from("module.md")
            displayName.set("LiveKit Mocks")
            sourceLink {
                localDirectory.set(file("src/main/java"))

                // URL showing where the source code can be accessed through the web browser
                remoteUrl.set(new URL(
                    "https://github.com/livekit/client-sdk-android/tree/master/livekit-android-test/src/main/java"))
                // Suffix which is used to append the line number to the URL. Use #L for GitHub
                remoteLineSuffix.set("#L")
            }

            perPackageOption {
                matchingRegex.set(".*\\.dagger.*")
                suppress.set(true)
            }

            perPackageOption {
                matchingRegex.set(".*\\.util.*")
                suppress.set(true)
            }
        }
    }
}

dependencies {

    implementation(project(":livekit-android-sdk"))
    implementation libs.coroutines.lib
    implementation libs.kotlinx.serialization.json
    // The SDK keeps livekit-uniffi as `implementation` so the FFI types stay out of its public
    // API. Tests here drive the FFI managers directly (capturing delegates, stub registries), so
    // they need it on their own classpath.
    implementation libs.livekit.uniffi
    api libs.okhttp.lib
    api libs.audioswitch
    implementation libs.androidx.annotation
    api libs.protobuf.javalite
    implementation libs.android.jain.sip.ri
    implementation libs.junit
    implementation libs.robolectric
    implementation libs.mockito.core
    implementation libs.mockito.kotlin
    implementation libs.mockito.inline
    implementation libs.androidx.test.core
    implementation libs.coroutines.test
    implementation libs.dagger.lib
    implementation libs.byte.buddy
    kapt libs.dagger.compiler

    testImplementation libs.junit
    testImplementation libs.robolectric
    // livekit-uniffi depends on jna's *aar*, which only carries Android .so dispatch libs. Host
    // JVM test runs need the plain jar, which bundles libjnidispatch for desktop platforms.
    testImplementation libs.jna.desktop
    testImplementation libs.okhttp.mockwebserver
    testImplementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    kaptTest libs.dagger.compiler

    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso
    // Instrumented tests drive the FFI directly to prove the native library works on a real
    // device; see DataStreamsOnDeviceTest.
    androidTestImplementation libs.livekit.uniffi
    androidTestImplementation libs.coroutines.lib
    androidTestImplementation libs.protobuf.javalite
}
apply from: rootProject.file('gradle/uniffi-native-lib.gradle')

tasks.withType(Test).configureEach {
    // One JVM per test class.
    //
    // The data stream core is a native library with process-global state (its async runtime, and
    // the callback vtables the bindings register into it), loaded through JNA. Robolectric gives
    // test classes their own classloaders, so a second class re-initializing those bindings can
    // leave the first class's -- or its own -- callbacks pointing nowhere, and every data stream
    // silently stops. It reproduced as whole test classes intermittently timing out depending on
    // execution order.
    //
    // Isolating classes into their own JVMs sidesteps it, at the cost of roughly 90s on this
    // module's suite. Worth revisiting if uniffi's Kotlin bindings ever become safe to initialize
    // more than once in a process.
    forkEvery = 1
    systemProperty "robolectric.logging.enabled", true
    // Data streams run through the Rust core, so unit tests need a host build of it.
    configureUniffiForUnitTests(it)
}

apply from: rootProject.file('gradle/gradle-mvn-push.gradle')
apply from: rootProject.file('gradle/dokka-kotlin-dep-fix.gradle')

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = GROUP
                artifactId = POM_ARTIFACT_ID
                version = VERSION_NAME
            }
        }
    }
}
