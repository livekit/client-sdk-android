pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
// Development wiring for unreleased Rust bindings: `-PlivekitUniffiVersion=<version>` (or the
// LIVEKIT_UNIFFI_VERSION environment variable) resolves livekit-uniffi-android at that version from
// Maven Local, where `cargo make android-package-local` in rust-sdks/livekit-uniffi publishes it.
// Unset, the released artifact from gradle/libs.versions.toml is used.
def localUniffi = providers.gradleProperty('livekitUniffiVersion')
        .orElse(providers.environmentVariable('LIVEKIT_UNIFFI_VERSION')).getOrNull()
if (localUniffi) {
    gradle.beforeProject { project ->
        project.configurations.configureEach {
            resolutionStrategy.eachDependency {
                if (requested.group == 'io.livekit' && requested.name == 'livekit-uniffi-android') useVersion(localUniffi)
            }
        }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (localUniffi) {
            mavenLocal { content { includeModule('io.livekit', 'livekit-uniffi-android') } }
        }
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
include ':sample-app', ':sample-app-compose', ':livekit-android-sdk'
rootProject.name = 'livekit-android'
include ':sample-app-common'
include ':livekit-lint'
include ':video-encode-decode-test'
include ':sample-app-basic'
include ':sample-app-record-local'
include ':examples:virtual-background'
include ':livekit-android-test'
include ':livekit-detekt-rules'
include ':livekit-android-camerax'
include ':examples:screenshare-audio'
include ':livekit-android-track-processors'
