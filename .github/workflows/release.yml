# After a release PR merges: build and test, then tag and create the GitHub
# release, then publish to Maven Central. The step that cannot be undone
# comes last.
# `verify` waits until Maven Central has the version, then asserts the
# end state. Docs and the components-android dispatch run after that.
name: Release

on:
  pull_request:
    types: [closed]
  # Re-run by hand after a fix: `verwalter release` resumes from the
  # current state and skips what is done. `publish` skips a version that
  # Maven Central already has.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to build and publish. Set it to the release tag when the tag exists. Empty is the branch head.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Only a run by hand, or a merged release PR that the tool opened: the
  # branch name alone would let any pushed `release/*` branch trigger a
  # publish. The author is `[release].author`, default
  # `verwalter-release[bot]`.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.verwalter.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
      - id: verwalter
        uses: livekit/verwalter@9da894a1e4f7d298095a961be60c818afd47905b # v0.32.0-rc.1
        with:
          command: gate

  # A failed build or test stops here, before a tag exists.
  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Fetch livekit-ffi host library
        id: uniffi
        run: |
          lib_dir=$(./ci/fetch_uniffi_cdylib.sh)
          echo "lib_dir=$lib_dir" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew livekit-android-sdk:assembleRelease livekit-android-camerax:assembleRelease livekit-android-test:testRelease "-PlivekitUniffiLibDir=${{ steps.uniffi.outputs.lib_dir }}"

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.verwalter.outputs.released }}
      releases: ${{ steps.verwalter.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit itself: a push to main right after the merge
          # must not move the tag.
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
          fetch-depth: 0
      - id: verwalter
        uses: livekit/verwalter@9da894a1e4f7d298095a961be60c818afd47905b # v0.32.0-rc.1
        with:
          command: release
          # On a run by hand, report the package even when its release is
          # complete, so that `notify` runs again after a recovery.
          args: ${{ github.event_name == 'workflow_dispatch' && '--package client-sdk-android' || '' }}

  publish:
    needs: release
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # One upload to Sonatype at a time: a second run waits for the first.
    # Without `queue: max`, a third run cancels the waiting one.
    concurrency:
      group: maven-central-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # the tool makes the draft release public after the publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
          fetch-depth: 0 # tags decide what is published
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Write signing and Sonatype credentials
        run: |
          echo $GPG_KEY_ARMOR | base64 --decode > ./release.asc
          gpg --quiet --output $GITHUB_WORKSPACE/release.gpg --dearmor ./release.asc
          sed -i -e "s,nexusUsername=,nexusUsername=$NEXUS_USERNAME,g" gradle.properties
          sed -i -e "s,nexusPassword=,nexusPassword=$NEXUS_PASSWORD,g" gradle.properties
          sed -i -e "s,signing.keyId=,signing.keyId=$GPG_KEY_ID,g" gradle.properties
          sed -i -e "s,signing.password=,signing.password=$GPG_PASSWORD,g" gradle.properties
          sed -i -e "s,signing.secretKeyRingFile=,signing.secretKeyRingFile=$GITHUB_WORKSPACE/release.gpg,g" gradle.properties
          sed -i -e "s,STAGING_PROFILE_ID=,STAGING_PROFILE_ID=$PROFILE_ID,g" gradle.properties
        env:
          GPG_KEY_ARMOR: "${{ secrets.SIGNING_KEY_ARMOR }}"
          GPG_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          PROFILE_ID: ${{ secrets.STAGING_PROFILE_ID }}

      # Runs publish.command from verwalter.toml, skipped when Maven Central
      # already has the version.
      - uses: livekit/verwalter@9da894a1e4f7d298095a961be60c818afd47905b # v0.32.0-rc.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: publish
          releases: ${{ needs.release.outputs.releases }}

  # Asserts the end state. Maven Central shows a new version up to about
  # 30 minutes after Sonatype accepts it, so the check asks again until then.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # reads only. A draft release is visible only with write access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: livekit/verwalter@9da894a1e4f7d298095a961be60c818afd47905b # v0.32.0-rc.1
        with:
          command: status
          args: --check --wait 90m

  # Runs after the release is complete. A failure here is red, but the
  # release jobs above stay green.
  notify:
    needs: [release, verify]
    if: contains(fromJson(needs.release.outputs.releases || '[]').*.package, 'client-sdk-android')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read the release
        id: release
        env:
          RELEASES: ${{ needs.release.outputs.releases }}
        run: |
          echo "$RELEASES" | jq -r '.[] | select(.package == "client-sdk-android") | "version=\(.version)\ntag=\(.tag)\nprerelease=\(.prerelease)"' >> "$GITHUB_OUTPUT"

      # Only a final release on main: the docs site holds one version, and
      # components-android follows the main line.
      - name: Dispatch to components-android
        if: steps.release.outputs.prerelease == 'false' && (github.event.pull_request.base.ref || github.ref_name) == 'main'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.E2E_DISPATCH_TOKEN }}
          repository: livekit/components-android
          event-type: update-livekit-version
          client-payload: '{"version": "${{ steps.release.outputs.version }}"}'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.prerelease == 'false' && (github.event.pull_request.base.ref || github.ref_name) == 'main'
        with:
          # The released tag: a run by hand from a newer commit must not
          # publish docs for code that Maven Central does not ship.
          ref: refs/tags/${{ steps.release.outputs.tag }}
          submodules: recursive

      - name: Set up JDK 17
        if: steps.release.outputs.prerelease == 'false' && (github.event.pull_request.base.ref || github.ref_name) == 'main'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build and upload docs
        if: steps.release.outputs.prerelease == 'false' && (github.event.pull_request.base.ref || github.ref_name) == 'main'
        run: |
          ./gradlew dokkaHtml
          aws s3 cp ./livekit-android-sdk/build/dokka/html/ s3://livekit-docs/client-sdk-android/ --recursive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOCS_DEPLOY_AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOCS_DEPLOY_AWS_API_SECRET }}
          AWS_DEFAULT_REGION: "us-east-1"
